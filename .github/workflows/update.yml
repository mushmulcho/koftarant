name: Copy blog and publish site

on:
  schedule:
    - cron: "17 2 * * *"   # every night, about 04:17 Sofia time
  workflow_dispatch:        # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Copy posts, comments and images from Blogger
        run: python3 scripts/update.py

      - name: Save the copy in the repository
        run: |
          git config user.name "blog-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data images
          git diff --cached --quiet || git commit -m "Blog backup $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
